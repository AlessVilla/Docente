<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Optimizador de salones</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #1A237E;
            --secondary: #4CAF50;
            --warning: #f39c12;
            --danger: #f44336;
            --bg-light: #f4f7f6;
            --text-dark: #2c3e50;
            --border: #e0e6ed;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { margin: 0; background-color: var(--bg-light); color: var(--text-dark); display: flex; flex-direction: column; height: 100vh; }
        
        .main-container { display: flex; flex: 1; overflow: hidden; position: relative; }
        
        /* paneles */
        .panel-left { width: 45%; padding: 1.5rem; background: white; border-right: 1px solid var(--border); overflow-y: auto; transition: width 0.3s ease; }
        .panel-right { width: 55%; padding: 1.5rem; background: var(--bg-light); overflow-y: auto; transition: width 0.3s ease; position: relative; }
        
        .panel-left.hidden { display: none; }
        .panel-right.expanded { width: 100%; }

        /* controles de UX */
        .btn-toggle {
            position: absolute; top: 1.5rem; right: 1.5rem; background: var(--primary); color: white;
            border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; z-index: 10;
        }
        
        h2, h3 { color: var(--primary); font-weight: 600; margin-top: 0; border-bottom: 2px solid var(--border); padding-bottom: 8px; }
        h2 { font-size: 1.3rem; }
        h3 { font-size: 1.1rem; margin-top: 20px; }
        
        /* formularios */
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.85rem; }
        input[type="text"], input[type="number"], select, input[list] {
            width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem;
        }
        .checkbox-group { display: flex; gap: 15px; margin-top: 10px; }
        .checkbox-group label { font-weight: normal; display: flex; align-items: center; gap: 5px; cursor: pointer; }
        
        button { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; color: white; transition: 0.2s; }
        .btn-add { background: var(--primary); margin-top: 10px; }
        .btn-run { background: var(--secondary); font-size: 1.1rem; padding: 12px; margin-top: 20px; }
        
        /* tarjetas de bandeja */
        .card { 
            background: #fff; border: 1px solid var(--border); border-left: 4px solid var(--primary); 
            padding: 10px; border-radius: 6px; margin-bottom: 8px; font-size: 0.9rem;
            display: flex; justify-content: space-between; align-items: center;
        }
        .card-content { flex: 1; }
        .card-title { font-weight: bold; margin-bottom: 4px; }
        .tag { background: #e3f2fd; color: #1976d2; padding: 3px 6px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; margin-right: 5px; display: inline-block; }
        
        /* botones de acción */
        .card-actions { display: flex; gap: 5px; }
        .btn-action { 
            background: transparent; border: 1px solid transparent; width: auto; 
            padding: 6px; font-size: 1.1rem; cursor: pointer; border-radius: 4px; transition: 0.2s;
        }
        .btn-action.edit:hover { background: #fff3e0; border: 1px solid #ffe0b2; color: var(--warning); }
        .btn-action.delete { color: var(--danger); }
        .btn-action.delete:hover { background: #ffebee; border: 1px solid #ffcdd2; }
        
        /* tablas e inventario */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; margin-bottom: 15px; font-size: 0.85rem; }
        th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--border); }
        th { background-color: var(--primary); color: white; }
        .table-compact th, .table-compact td { padding: 4px 8px; font-size: 0.8rem; }
        
        .status-ok { color: var(--secondary); font-weight: bold; }
        .status-fail { color: var(--danger); font-weight: bold; }
        .empty-state { text-align: center; color: #7f8c8d; margin-top: 20px; font-style: italic; font-size: 0.9rem; }
        
        /* estilos para bloqueo de salones */
        .btn-lock { background: transparent; border: none; cursor: pointer; font-size: 1.1rem; padding: 2px; width: auto; color: inherit; }
        .btn-lock:hover { transform: scale(1.15); }
        .row-blocked { opacity: 0.4; background-color: #e0e0e0; text-decoration: line-through; }
        
        footer { text-align: center; padding: 10px; background: white; border-top: 1px solid var(--border); font-size: 0.8rem; color: #666; }
    </style>
</head>
<body>

    <div class="main-container">
        <!-- panel izquierdo: controles y demanda -->
        <div class="panel-left" id="panelIzquierdo">
            <h2>1. Configuración de la demanda</h2>

                    <option value="Especialización en Seguridad Informática">

                    <option value="Especialización en Derecho Procesal y Probatorio">
                    <option value="Especialización en Gerencia de la Seguridad y Salud en el Trabajo">
                    <option value="Especialización en Gestión Pública Territorial">

                    <option value="Especialización en Revisoría Fiscal y Auditoria Internacional">

            </div>
            
            <div class="form-group">
                <label>Aforo total (incluyendo docente e invitados)</label>
                <input type="number" id="personas" placeholder="Ej. 35" min="1">
            </div>
            
            <div class="form-group checkbox-group">
                <label><input type="checkbox" id="reqSistemas"> Requiere sistemas</label>
                <label><input type="checkbox" id="reqTablero" checked> Requiere tablero</label>
            </div>
            
            <button class="btn-add" id="btnAgregar" onclick="procesarIngreso()">+ Agregar a la bandeja</button>

            <h3>Bandeja de pendientes</h3>
            <div id="listaPendientes"><div class="empty-state">No hay clases pendientes.</div></div>

            <button class="btn-run" onclick="ejecutarOptimizacion()">Asignar salones automáticamente</button>
        </div>

        <!-- panel derecho: recursos y resultados -->
        <div class="panel-right" id="panelDerecho">
            <button class="btn-toggle" id="btnToggle" onclick="alternarPanel()">Ocultar panel de configuración</button>
            
            <h2>2. Inventario de salones disponibles</h2>
            <div id="tablaSalonesDiv"></div>
            
            <h2 style="margin-top: 20px;">3. Matriz de asignación óptima</h2>
            <div id="resultadosDiv"><div class="empty-state">La matriz está vacía. Ejecuta la asignación.</div></div>
        </div>
    </div>

    <footer>
        Creado por Alessandro Villanueva
    </footer>

            { id: "Sala 03 de Biblioteca", sede: "Cosmos", cap: 30, sis: 1, tab: 1, p_maest: 0, req_apr: 0, es_junta: 0, bloqueado: false },
            { id: "CINEMATECA", sede: "Cosmos", cap: 35, sis: 0, tab: 1, p_maest: 0, req_apr: 1, es_junta: 0, bloqueado: false },

            { id: "Creativity Room", sede: "Romelio", cap: 50, sis: 0, tab: 1, p_maest: 0, req_apr: 1, es_junta: 0, bloqueado: false },
            { id: "Sala 02", sede: "Romelio", cap: 30, sis: 1, tab: 1, p_maest: 0, req_apr: 1, es_junta: 0, bloqueado: false },
            { id: "Spectra", sede: "Prado", cap: 44, sis: 0, tab: 1, p_maest: 1, req_apr: 0, es_junta: 0, bloqueado: false },
            { id: "Croma", sede: "Prado", cap: 44, sis: 0, tab: 1, p_maest: 1, req_apr: 0, es_junta: 0, bloqueado: false },
            { id: "Aurora", sede: "Prado", cap: 58, sis: 0, tab: 1, p_maest: 1, req_apr: 0, es_junta: 0, bloqueado: false },
            { id: "Sala Juntas Luis Miguel Corredor", sede: "Prado", cap: 27, sis: 0, tab: 0, p_maest: 1, req_apr: 1, es_junta: 1, bloqueado: false },
            { id: "Sala Juntas Auxiliar", sede: "Prado", cap: 8, sis: 0, tab: 0, p_maest: 1, req_apr: 1, es_junta: 1, bloqueado: false },
            { id: "Sala Juntas Vicerrectoría", sede: "Prado", cap: 12, sis: 0, tab: 0, p_maest: 1, req_apr: 1, es_junta: 1, bloqueado: false }
        ];

        let clasesPendientes = [];
        let indexEdicion = null; 

        function alternarPanel() {
            const panelIzq = document.getElementById('panelIzquierdo');
            const panelDer = document.getElementById('panelDerecho');
            const btn = document.getElementById('btnToggle');

            if (panelIzq.classList.contains('hidden')) {
                panelIzq.classList.remove('hidden');
                panelDer.classList.remove('expanded');
                btn.innerText = 'Ocultar panel de configuración';
            } else {
                panelIzq.classList.add('hidden');
                panelDer.classList.add('expanded');
                btn.innerText = 'Mostrar panel de configuración';
            }
        }

        // renderiza el inventario con el botón de bloqueo dinámico
        function renderizarInventario() {
            let html = `<table class="table-compact">
                            <thead><tr><th>Sede</th><th>Salón</th><th>Cap.</th><th>Sistemas</th><th>Maestría</th><th>Estado</th></tr></thead>
                            <tbody>`;
            salonesBase.forEach((s, index) => {
                let rowClass = s.bloqueado ? 'row-blocked' : '';
                let lockIcon = s.bloqueado ? '🔒' : '🔓';
                let lockTitle = s.bloqueado ? 'Desbloquear salón' : 'Bloquear salón';
                
                html += `<tr class="${rowClass}">
                            <td>${s.sede}</td>
                            <td><strong>${s.id}</strong></td>
                            <td>${s.cap}</td>
                            <td>${s.sis ? 'Sí' : 'No'}</td>
                            <td>${s.p_maest ? 'Sí' : 'No'}</td>
                            <td style="text-align: center;">
                                <button class="btn-lock" onclick="toggleBloqueo(${index})" title="${lockTitle}">${lockIcon}</button>
                            </td>
                         </tr>`;
            });
            html += `</tbody></table>`;
            document.getElementById('tablaSalonesDiv').innerHTML = html;
        }

        // función para alternar el estado de bloqueo de un salón
        function toggleBloqueo(index) {
            salonesBase[index].bloqueado = !salonesBase[index].bloqueado;
            renderizarInventario();
            // si quieres que reasigne automáticamente al bloquear/desbloquear, descomenta la siguiente línea:
            // ejecutarOptimizacion();
        }

        renderizarInventario();

        function procesarIngreso() {
            const prog = document.getElementById('programaInput').value;
            const personas = parseInt(document.getElementById('personas').value);
            const sis = document.getElementById('reqSistemas').checked;
            const tab = document.getElementById('reqTablero').checked;

            if(!prog || isNaN(personas)) { 
                Swal.fire({ icon: 'warning', title: 'Faltan datos', text: 'Selecciona un programa y el aforo.'}); 
                return; 
            }

            if(prog === "Especial / Evento masivo") {
                Swal.fire({
                    title: 'Nombre del espacio',
                    input: 'text',
                    inputPlaceholder: 'Ej. conferencia internacional...',
                    showCancelButton: true,
                    confirmButtonText: 'Guardar'
                }).then(result => {
                    if (result.isConfirmed && result.value) {
                        agregarALista(result.value, 'Especial', personas, sis, tab);
                    }
                });
            } else {
                let tipo = prog.toLowerCase().includes('maestría') ? 'Maestria' : 'Especializacion';
                agregarALista(prog, tipo, personas, sis, tab);
            }
        }

        function agregarALista(nombre, tipo, personas, sis, tab) {
            if (indexEdicion !== null) {
                clasesPendientes[indexEdicion] = { nombre, tipo, personas, sis, tab, asignacion: null };
                indexEdicion = null;
                const btn = document.getElementById('btnAgregar');
                btn.innerText = '+ Agregar a la bandeja';
                btn.style.backgroundColor = 'var(--primary)';
            } else {
                clasesPendientes.push({ nombre, tipo, personas, sis, tab, asignacion: null });
            }
            
            document.getElementById('programaInput').value = '';
            document.getElementById('personas').value = '';
            document.getElementById('reqSistemas').checked = false;
            document.getElementById('reqTablero').checked = true;
            
            renderizarBandeja();
        }

        function cargarParaEdicion(index) {
            const clase = clasesPendientes[index];
            document.getElementById('programaInput').value = clase.nombre;
            document.getElementById('personas').value = clase.personas;
            document.getElementById('reqSistemas').checked = clase.sis;
            document.getElementById('reqTablero').checked = clase.tab;
            
            indexEdicion = index;
            const btn = document.getElementById('btnAgregar');
            btn.innerText = '💾 Guardar cambios';
            btn.style.backgroundColor = 'var(--warning)';
        }

        function eliminarDeLista(index) {
            if (indexEdicion === index) {
                indexEdicion = null;
                const btn = document.getElementById('btnAgregar');
                btn.innerText = '+ Agregar a la bandeja';
                btn.style.backgroundColor = 'var(--primary)';
                document.getElementById('programaInput').value = '';
                document.getElementById('personas').value = '';
            }
            clasesPendientes.splice(index, 1);
            renderizarBandeja();
        }

        function renderizarBandeja() {
            const list = document.getElementById('listaPendientes');
            list.innerHTML = '';
            if(clasesPendientes.length === 0) { list.innerHTML = '<div class="empty-state">No hay clases pendientes.</div>'; return; }

            clasesPendientes.forEach((clase, index) => {
                let tags = `<span class="tag">${clase.personas} pax</span><span class="tag">${clase.tipo}</span>`;
                if(clase.sis) tags += `<span class="tag">Sistemas</span>`;
                
                list.innerHTML += `
                    <div class="card">
                        <div class="card-content">
                            <div class="card-title">${clase.nombre}</div>
                            <div>${tags}</div>
                        </div>
                        <div class="card-actions">
                            <button class="btn-action edit" onclick="cargarParaEdicion(${index})" title="Editar programa">✏️️</button>
                            <button class="btn-action delete" onclick="eliminarDeLista(${index})" title="Eliminar programa">🗑️</button>
                        </div>
                    </div>`;
            });
        }

        function ejecutarOptimizacion() {
            if(clasesPendientes.length === 0) return;

            let salonesDisponibles = JSON.parse(JSON.stringify(salonesBase));
            salonesDisponibles.forEach(s => s.ocupado = false);

            let demanda = [...clasesPendientes].sort((a, b) => {
                return ((b.sis ? 100 : 0) + b.personas) - ((a.sis ? 100 : 0) + a.personas); 
            });

            demanda.forEach(clase => {
                let mejorSalon = null;
                let mejorPuntajeZ = -99999;

                salonesDisponibles.forEach(salon => {
                    // restricción dura añadida: salta el salón si está bloqueado manualmente
                    if (salon.ocupado || salon.bloqueado || salon.cap < clase.personas) return;
                    if (clase.sis && !salon.sis) return;
                    if (clase.tab && !salon.tab) return;
                    if (clase.tipo === "Maestria" && salon.sede === "Romelio") return; 
                    if (salon.id === "Aurora" && clase.tipo !== "Especializacion") return;
                    if (salon.id === "Auditorio Jaime Muñoz" && clase.tipo === "Maestria") return;

                    let puntajeZ = 0;

                    if (clase.tipo === "Maestria") {
                        if (salon.sede === "Prado" && salon.es_junta === 0) puntajeZ += 1500;
                        else if (salon.es_junta === 1) puntajeZ += 1000;
                        else if (salon.id === "CINEMATECA" || salon.sede === "Cosmos") puntajeZ += 500;
                    } else if (clase.tipo === "Especializacion") {
                        if (salon.sede === "Cosmos") puntajeZ += 1000;
                        else if (salon.sede === "Romelio") puntajeZ += 500;
                    } else if (clase.tipo === "Especial") {
                        if (salon.sede === "Prado") puntajeZ += 1000;
                        if (salon.req_apr === 1) puntajeZ += 800;
                    }

                    puntajeZ += 100 * (1 - ((salon.cap - clase.personas) / salon.cap)); 

                    if (puntajeZ > mejorPuntajeZ) {
                        mejorPuntajeZ = puntajeZ;
                        mejorSalon = salon;
                    }
                });

                if (mejorSalon) {
                    mejorSalon.ocupado = true;
                    clase.asignacion = mejorSalon;
                } else {
                    clase.asignacion = "SIN CUPO";
                }
            });

            renderizarResultados(demanda);
        }

        function renderizarResultados(resultados) {
            let html = `<table><thead><tr><th>Programa</th><th>Aforo</th><th>Sede</th><th>Salón</th><th>Estado</th></tr></thead><tbody>`;
            resultados.forEach(res => {
                if (res.asignacion === "SIN CUPO") {
                    html += `<tr><td><strong>${res.nombre}</strong></td><td>${res.personas}</td>
                             <td colspan="2" class="status-fail">Sin espacios viables</td><td class="status-fail">Rechazado</td></tr>`;
                } else {
                    html += `<tr><td><strong>${res.nombre}</strong></td><td>${res.personas}</td>
                             <td><span class="tag">${res.asignacion.sede}</span></td>
                             <td><strong>${res.asignacion.id}</strong></td>
                             <td class="status-ok">Asignado</td></tr>`;
                }
            });
            html += `</tbody></table>`;
            document.getElementById('resultadosDiv').innerHTML = html;
        }
    </script>
